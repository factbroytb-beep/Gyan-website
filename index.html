<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYAN SINGH | Official Website</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b0b0f;
    color:white;
    text-align:center;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:#111118;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.insta{
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border:1px solid #fff;
    border-radius:25px;
}

.hero{
    min-height:75vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.profile{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid white;
    margin-bottom:25px;
}

h1{
    font-size:42px;
    margin-bottom:15px;
}

h1 span{
    text-decoration:underline;
}

.hero p{
    color:#bbb;
    font-size:18px;
    margin-bottom:30px;
}

.btn{
    display:inline-block;
    background:white;
    color:#111;
    padding:14px 28px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
}

.about{
    padding:60px 20px;
    background:#111118;
}

.about h2{
    font-size:32px;
    margin-bottom:20px;
}

.about p{
    max-width:600px;
    margin:auto;
    color:#bbb;
    line-height:1.7;
}

footer{
    padding:25px;
    color:#888;
}

@media(max-width:600px){
    h1{
        font-size:32px;
    }

    .logo{
        font-size:20px;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">GYAN SINGH</div>
    <a class="insta" href="https://instagram.com/gyan_singh222" target="_blank">
        Instagram
    </a>
</nav>

<section class="hero">

    <img class="profile" src="profile.jpg" alt="Gyan Singh">

    <h1>Hello, I'm <span>Gyan</span> 👋</h1>

    <p>Welcome to my official personal website 🚀</p>

    <a class="btn" href="https://instagram.com/gyan_singh222" target="_blank">
        Follow Me on Instagram
    </a>

</section>

<section class="about">

    <h2>About Me</h2>

    <p>
        Hi! I'm Gyan Singh. Welcome to my official website.
        Here you can learn more about me and connect with me on Instagram.
    </p>

</section>

<footer>
    © 2026 Gyan Singh • All Rights Reserved
</footer>

</body>
</html>
